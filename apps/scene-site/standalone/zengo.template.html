function fit() { const [w, h] = half(), narrow = innerWidth < 900; st.tScale = st.base * (narrow ? Math.min(1, w * .92 / 3.8) * (st.layout === "side" ? .82 : 1) : 1);
  st.ox = st.layout === "side" && !narrow ? w * .42 : 0; st.oy = st.layout === "side" && narrow ? h * .36 : 0; }
function resize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); if (renderer) { renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight, false); mat.uniforms.uPR.value = renderer.getPixelRatio(); } fit(); if (reduced) draw(1); }
addEventListener("resize", resize);
addEventListener("pointermove", e => { st.mx = e.clientX / innerWidth - .5; st.my = e.clientY / innerHeight - .5; const [w, h] = half(); st.cursor.set(st.mx * 2 * w, -st.my * 2 * h, 0); st.shock = 1; wake(); }, { passive: true });

function getShape(spec) { const k = JSON.stringify(spec); if (!cache.has(k)) cache.set(k, buildShape(spec, COUNT)); return cache.get(k); }
function showVisual(s, layout) {
  target = getShape(s.shape); st.color.setRGB(...s.particle); const r = s.rot || [.2, -.62, .05]; st.tRot.set(...r); st.layout = layout; st.base = s.scale || 1; fit();
  st.tbg1 = s.glow[0]; st.tbg2 = s.glow[1]; st.shock = Math.max(st.shock, .6);
  if (reduced) { pos.set(target); mat.uniforms.uColor.value.copy(st.color); st.bg1 = [...st.tbg1]; st.bg2 = [...st.tbg2]; draw(1); } else wake();
}
function paintBg(T) { // iki gezinen ışık lekesi + alt karartma (renkler sahneye doğru yumuşakça akar)
  const a = 22 + Math.sin(T * .27) * 14, b = 32 + Math.cos(T * .23) * 16, c = 80 + Math.cos(T * .25) * 14, d = 68 + Math.sin(T * .3) * 16, p = x => x.map(Math.round).join(",");
  bg.style.background = `radial-gradient(70% 95% at ${a.toFixed(1)}% ${b.toFixed(1)}%, rgba(${p(st.bg1)},.42), transparent 60%), radial-gradient(75% 90% at ${c.toFixed(1)}% ${d.toFixed(1)}%, rgba(${p(st.bg2)},.55), transparent 62%), radial-gradient(120% 120% at 50% 120%, rgba(2,3,8,.7), transparent 70%), #05060c`;
}
function draw(k) {
  st.rot.x += (st.tRot.x - st.rot.x) * k; st.rot.y += (st.tRot.y - st.rot.y) * k; st.rot.z += (st.tRot.z - st.rot.z) * k;
  points.rotation.set(st.rot.x + st.my * .12, st.rot.y + (reduced ? 0 : Math.sin(st.t * .25) * .12) + st.mx * .25, st.rot.z);
  st.scale += (st.tScale - st.scale) * k; points.scale.setScalar(st.scale);
  points.position.x += (st.ox - points.position.x) * k; points.position.y += (st.oy - points.position.y) * k;
  for (let i = 0; i < 3; i++) { st.bg1[i] += (st.tbg1[i] - st.bg1[i]) * k * .5; st.bg2[i] += (st.tbg2[i] - st.bg2[i]) * k * .5; }
  paintBg(st.t); if (renderer) renderer.render(scene, camera);
}
// döngü: kare hızından bağımsız; 90 sn hareketsizlikte ve sekme gizliyken uyur
let raf = 0, running = false, last = 0, idle = 0;
function frame(now) {
  if (!running) return; raf = requestAnimationFrame(frame);
  const dt = last ? Math.min((now - last) / (1000 / 60), 4) : 1; last = now; st.t += dt / 60;
  const ease = 1 - Math.pow(1 - .075, dt), tg = target, T = st.t, amp = .035; const shock = (st.shock *= Math.pow(.94, dt));
  let cx = 0, cy = 0, cz = 0; if (shock > .02) { points.updateMatrixWorld(); const l = points.worldToLocal(st.cursor.clone()); cx = l.x; cy = l.y; cz = l.z; }
  const R2 = 1.6 * 1.6, push = .22 * shock * dt;
  for (let i = 0, j = 0; i < COUNT; i++, j += 3) { const f = phase[i];
    let x = pos[j] + (tg[j] + Math.sin(T * .9 + f) * amp - pos[j]) * ease, y = pos[j+1] + (tg[j+1] + Math.cos(T * .8 + f * 1.3) * amp - pos[j+1]) * ease, z = pos[j+2] + (tg[j+2] + Math.sin(T * .7 + f * .7) * amp - pos[j+2]) * ease;
    if (shock > .02) { const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy; if (d2 < R2) { const d = Math.sqrt(d2) + 1e-4, k = (1 - d / 1.6) * push; x += dx / d * k; y += dy / d * k; z += (z - cz) * .02 * k; } }
    pos[j] = x; pos[j+1] = y; pos[j+2] = z; }
  geo.attributes.position.needsUpdate = true; mat.uniforms.uColor.value.lerp(st.color, ease * .6); mat.uniforms.uTime.value = T; draw(ease * .8);
}
function wake() { if (reduced) return; clearTimeout(idle); idle = setTimeout(sleep, 90000); delete document.body.dataset.ambient; if (!running) { running = true; last = 0; raf = requestAnimationFrame(frame); } }
function sleep() { running = false; cancelAnimationFrame(raf); document.body.dataset.ambient = "paused"; }
document.addEventListener("visibilitychange", () => document.hidden ? sleep() : wake());
for (const ev of ["pointerdown", "keydown", "wheel", "touchstart"]) addEventListener(ev, wake, { passive: true });

// ================= SAHNE GEZİNMESİ =================
const $scenes = document.getElementById("scenes"), $label = document.getElementById("label"), $count = document.getElementById("count"), $progress = document.getElementById("progress"), $stepper = document.getElementById("stepper");
const pad = n => String(n).padStart(2, "0");
SCENES.forEach((s, k) => {
  const el = document.createElement("section"); el.className = "scene" + (s.intro ? " center" : ""); el.setAttribute("aria-hidden", "true");
  el.innerHTML = (s.eyebrow ? `<p class="eyebrow${s.intro ? " chip glass" : ""}">${s.eyebrow}</p>` : "") + (s.intro ? `<h1 class="display">${s.title}</h1>` : `<h2 class="title">${s.title}</h2>`)
    + (s.body ? `<p class="body">${s.body}</p>` : "")
    + (s.intro ? `<button class="orb" data-next><span class="orb-core"></span><span class="orb-label">${s.cta}</span></button>` : `<a class="glass pill${s.primary ? " primary" : ""}" href="#">${s.cta}${s.primary ? ' <span aria-hidden="true">→</span>' : ""}</a>`);
  $scenes.appendChild(el);
  const t = document.createElement("button"); t.className = "tick"; t.setAttribute("aria-label", s.label); t.onclick = () => go(k); $progress.appendChild(t);
});
let cur = -1, lock = 0;
function go(n) {
  n = Math.max(0, Math.min(SCENES.length - 1, n)); if (n === cur) return; const prev = cur; cur = n; const s = SCENES[n];
  [...$scenes.children].forEach((el, k) => { el.classList.toggle("active", k === n); el.setAttribute("aria-hidden", k === n ? "false" : "true"); });
  [...$progress.children].forEach((el, k) => el.classList.toggle("on", k === n));
  $label.textContent = s.label; $count.textContent = `${pad(n)} / ${pad(SCENES.length - 1)}`;
  $stepper.style.opacity = n === 0 ? "0" : "1"; $stepper.style.pointerEvents = n === 0 ? "none" : "auto"; document.getElementById("next").disabled = n === SCENES.length - 1;
  showVisual(s, s.intro ? "center" : "side"); history.replaceState(null, "", n ? `#${n}` : location.pathname + location.search);
}
const step = d => { const now = performance.now(); if (now - lock < 900) return; lock = now; go(cur + d); };
addEventListener("wheel", e => { if (Math.abs(e.deltaY) > 18) step(e.deltaY > 0 ? 1 : -1); }, { passive: true });
addEventListener("keydown", e => { if (["ArrowDown", "PageDown", " ", "ArrowRight", "Enter"].includes(e.key)) { e.preventDefault(); step(1); } else if (["ArrowUp", "PageUp", "ArrowLeft"].includes(e.key)) { e.preventDefault(); step(-1); } else if (e.key === "Home") go(0); else if (e.key === "End") go(SCENES.length - 1); });
let y0 = 0; addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true }); addEventListener("touchend", e => { const d = y0 - e.changedTouches[0].clientY; if (Math.abs(d) > 50) step(d > 0 ? 1 : -1); }, { passive: true });
document.getElementById("prev").onclick = () => step(-1); document.getElementById("next").onclick = () => step(1); document.getElementById("home").onclick = () => go(0);
$scenes.addEventListener("click", e => { if (e.target.closest("[data-next]")) go(1); });

resize();
const start = Number(location.hash.slice(1)); go(Number.isInteger(start) && start > 0 && start < SCENES.length ? start : 0);
// sonraki şekilleri boşta hazırla (ilk geçişte takılma olmasın)
document.fonts.ready.then(() => { let k = 0; const warm = () => { if (k >= SCENES.length) return; getShape(SCENES[k++].shape); (window.requestIdleCallback || setTimeout)(warm); }; warm(); });
</script>
</body>
